ble:
  name_prefix: "ESP32-RGB-BLE"     # or set "addr" to connect directly to an address
  addr: null                       # e.g. "44:1D:64:F4:AC:D2" on Linux/Mac, GUID on Windows
  scan_timeout: 8.0                # seconds

capture:
  frequency_ms: 200
  output_root: "../captures"          # può stare anche in OneDrive; io terrei locale per prestazioni
  use_camera: false                 # false = modalità test, copia immagini da "test_source_dir"
  camera_type: "opencv"            # "opencv" = cv2.VideoCapture, "pylon" = Basler via pypylon
  camera_id: 0                     # id della webcam (solo per camera_type=opencv)
  camera_serial: null              # seriale Basler (camera_type=pylon)
  camera_ip: null                  # IP Basler (camera_type=pylon)
  image_format: "tiff"             # "jpg" o "png"
  jpeg_quality: 90
  tiff_compression: "lzw"          # none | lzw | deflate | packbits
  test_source_dir: "../image_to_be_used"   # used when use_camera=false
  stop_on_test_exhausted: false    # true = end session when test images end
  stop_on_ble_disconnect: true     # automatically stop if BLE connection drops
  keep_session_frames_on_error: true # if stop/rename fails, keep frames

pose:
  enabled: true
  method: "charuco"                # "charuco" | "custom"
  max_parallel_jobs: 3             # limit concurrent jobs
  delete_frames_after_processing: true
  results_format: "json"           # json recommended
  cube:
    dictionary: "4X4_50"
    marker_size_mm: 53.0      # marker side (black area only)
    cube_size_mm: 62.0        # cube side length
    pair_strategy: "first"    # or "max_angle"
  camera_calibration_npz: "../calib/calib_data.npz"  # must contain 'camera_matrix' and 'dist_coeffs'

runtime:
  debug: true                      # verbose logging
  log_to_file: true               # enable global log file, otherwise console only
