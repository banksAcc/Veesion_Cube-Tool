ble:
  name_prefix: "ESP32-RGB-BLE"     # or use "addr" to connect directly to an address
  addr: null                       # e.g. "44:1D:64:F4:AC:D2" on Linux/Mac, GUID on Windows
  scan_timeout: 3.0                # seconds

capture:
  frequency_ms: 100
  output_root: "../captures"       # can also be in OneDrive; keeping it local is faster
  save_frames: true                # when true, persist frames with pose overlays if available
  frame_queue_size: 20               # max number of frames waiting in the in-memory stream
  simulate_camera: false           # true = test mode (uses images from a folder)
  camera_type: "opencv"             # "opencv" for webcam or "pylon" for basler.
  camera_id: 0                     # webcam id (0 usually works)
  camera_serial: 23324651          # serial number for industrial cameras
  camera_ip: 192.168.1.165         # URL/IP for network cameras
  test_source_dir: "../image_to_be_used"   # used if simulate_camera=true

pose:
  enabled: true
  method: "ico"                   # "cube" | "ico" | "custom"
  max_parallel_jobs: 3             # 3 is fine (CPU permitting)
  save_overlay: true               # save diagnostic overlays next to raw frames using *_overlay suffix
  cube:
    dictionary: "4X4_50"
    marker_size_mm: 54.0      # marker side (only black portion)
    cube_size_mm: 60.0        # cube side
    pair_strategy: "max_angle"    # first or max_angle
    wand_offset_m: 0.17
    wand_directions:
      "0": "+X"
      "1": "+X"
      "2": "-X"
      "3": "+X"
      "4": "-Z"
    marker_filter:
      active_marker_filter: true
      try_adj_marker: true
      area_threshold_px: 1500.0
      min_flip_interval_s: 0.05
  ico:
    dictionary: "4X4_50"
    marker_size_mm: 21.679
    transform_file: null          # leave null to use built-in transforms
    marker_filter:
      active_marker_filter: false
      try_adj_marker: false
      area_threshold_px: 1500.0
      min_flip_interval_s: 0.05
  camera_calibration_npz: "pc/app/calib/calib_data.npz"  # must contain 'camera_matrix' and 'dist_coeffs'

runtime:
  debug: true                      # extra debug behavior
  log_level: DEBUG                 # DEBUG, INFO, WARNING, ERROR
  log_to_file: true               # write global app.log in addition to console

plot:
  default_pose_json: "../captures/session_2025-10-30_10-34-40_pose.json"
