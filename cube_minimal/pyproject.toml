[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cube-minimal"
version = "0.1.0"
description = "Minimal cube pose estimation from ArUco markers"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "opencv-python",
    "numpy",
]

[tool.setuptools.packages.find]
where = ["."]
