[tool.ruff]
line-length = 100
target-version = "py311"
src = ["pc/app"]
exclude = ["pc/app/_peek.py", "pc/app/click_test.py"]

[tool.ruff.lint]
select = ["E", "F", "B"]
ignore = ["B027", "E501"]

[tool.mypy]
python_version = "3.11"
files = [
    "pc/app/app.py",
    "pc/app/ble_client.py",
    "pc/app/config_models.py",
    "pc/app/logger.py",
    "pc/app/messages.py",
    "pc/app/pose_worker.py",
    "pc/app/session_manager.py",
]
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true
namespace_packages = true
exclude = ["cube_minimal", "esp32"]
follow_imports = "skip"

[[tool.mypy.overrides]]
module = [
    "bleak",
    "cv2",
    "numpy",
    "cube_minimal.*",
    "pypylon.*",
    "yaml",
]
ignore_missing_imports = true
